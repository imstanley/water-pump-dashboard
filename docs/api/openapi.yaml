openapi: 3.0.0
info:
  title: Water Pump Dashboard API
  version: 1.0.0
  description: API for monitoring and controlling water pump systems
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Pumps
    description: Pump management operations
  - name: Readings
    description: Pump reading operations
  - name: Controls
    description: Pump control operations
  - name: Config
    description: Pump configuration operations
  - name: Alerts
    description: Alert management operations

paths:
  /pumps:
    get:
      tags:
        - Pumps
      summary: Get all pumps
      description: Retrieve a list of all pumps
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pump'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

    post:
      tags:
        - Pumps
      summary: Create a new pump
      description: Create a new pump with the provided information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePumpInput'
      responses:
        '201':
          description: Pump created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pump'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /pumps/{id}:
    get:
      tags:
        - Pumps
      summary: Get a pump by ID
      description: Retrieve a single pump by its ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pump'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Pumps
      summary: Update a pump
      description: Update an existing pump
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePumpInput'
      responses:
        '200':
          description: Pump updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pump'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Pumps
      summary: Delete a pump
      description: Delete a pump by its ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpId'
      responses:
        '200':
          description: Pump deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pumps/{id}/readings:
    get:
      tags:
        - Readings
      summary: Get pump readings
      description: Retrieve readings for a specific pump within a date range
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpId'
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PumpReading'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pumps/{id}/controls:
    post:
      tags:
        - Controls
      summary: Send pump control command
      description: Send a control command to a pump
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPumpCommandInput'
      responses:
        '201':
          description: Command sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PumpControl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /config:
    get:
      tags:
        - Config
      summary: Get pump configuration
      description: Retrieve configuration for a pump
      security:
        - bearerAuth: []
      parameters:
        - name: pump_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PumpConfig'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Config
      summary: Update pump configuration
      description: Update configuration for a pump
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePumpConfigInput'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PumpConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts:
    get:
      tags:
        - Alerts
      summary: Get alerts
      description: Retrieve alerts with optional filtering
      security:
        - bearerAuth: []
      parameters:
        - name: pump_id
          in: query
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, warning, info]
        - name: acknowledged
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PumpAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/{id}/acknowledge:
    post:
      tags:
        - Alerts
      summary: Acknowledge an alert
      description: Mark an alert as acknowledged
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Alert acknowledged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PumpAlert'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PumpId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Pump ID

  schemas:
    Pump:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        api_endpoint:
          type: string
          nullable: true
        api_key:
          type: string
          nullable: true
        status:
          type: string
          enum: [running, stopped, error, unknown]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true

    CreatePumpInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: string
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        api_endpoint:
          type: string
          format: uri
        api_key:
          type: string
        status:
          type: string
          enum: [running, stopped, error, unknown]
          default: unknown

    UpdatePumpInput:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        api_endpoint:
          type: string
        api_key:
          type: string
        status:
          type: string
          enum: [running, stopped, error, unknown]

    PumpReading:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pump_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        pressure:
          type: number
        flow_rate:
          type: number
        temperature:
          type: number
        status:
          type: string
          enum: [running, stopped, error, unknown]
        power_consumption:
          type: number
        created_at:
          type: string
          format: date-time

    PumpConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pump_id:
          type: string
          format: uuid
        api_endpoint:
          type: string
          nullable: true
        api_key:
          type: string
          nullable: true
        poll_interval:
          type: integer
        alert_thresholds:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdatePumpConfigInput:
      type: object
      properties:
        pump_id:
          type: string
          format: uuid
        api_endpoint:
          type: string
        api_key:
          type: string
        poll_interval:
          type: integer
          minimum: 5
          maximum: 3600
        alert_thresholds:
          type: object

    SendPumpCommandInput:
      type: object
      required:
        - pump_id
        - command_type
      properties:
        pump_id:
          type: string
          format: uuid
        command_type:
          type: string
          enum: [start, stop, set_pressure, set_flow_rate]
        command_value:
          type: string
          nullable: true

    PumpControl:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pump_id:
          type: string
          format: uuid
        command_type:
          type: string
        command_value:
          type: string
          nullable: true
        status:
          type: string
        executed_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    PumpAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pump_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [critical, warning, info]
        message:
          type: string
        pump_reading_id:
          type: string
          format: uuid
          nullable: true
        acknowledged:
          type: boolean
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        acknowledged_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: array
          items:
            type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              retryAfter:
                type: integer
